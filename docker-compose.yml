services:
  zlabel_server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./assets:/app/assets
    environment:
      - ZLSERVER_DATABASE_URL=./zlabel_server.db
      - ZLSERVER_VERSION=1.0.0
      - ZLSERVER_MODEL_NAME=EdgeSAM
      - ZLSERVER_ENCODER_PATH=assets/edge_sam_3x_encoder.onnx
      - ZLSERVER_DECODER_PATH=assets/edge_sam_3x_decoder.onnx
      - ZLSERVER_OPLIST_HOST=http://127.0.0.1:5244
      - ZLSERVER_OPLIST_PROJ_DIR=/zlabel_server/projects
      - ZLSERVER_OPLIST_PROJ_NAME=seed_germ_anno
      - ZLSERVER_IMAGE_CACHE_SIZE=100
    depends_on:
      - openlist
    restart: unless-stopped

  openlist:
    image: 'openlistteam/openlist:latest'
    container_name: openlist
    user: '0:0' # Please replace `0:0` with the actual user ID and group ID you want to use to run OpenList.
    volumes:
      - './data:/opt/openlist/data'
    ports:
      - '5244:5244'
    environment:
      - UMASK=022
    restart: unless-stopped