services:
  zlabel_server:
    # `user:` is deliberately left commented out: entrypoint.sh starts as root,
    # repairs the ownership of ./data and only then drops to
    # ${ZLABEL_UID:-0}:${ZLABEL_GID:-0}. A `user:` here takes CAP_CHOWN away, so
    # the entrypoint could only *report* a root-owned dataset instead of fixing
    # it. Uncomment for "no root process at all" and fix ownership once on the
    # host instead:
    #   sudo chown -R "$(id -u):$(id -g)" data
    # user: "${ZLABEL_UID:-0}:${ZLABEL_GID:-0}"
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    env_file:
      - .env.v2
    environment:
      # who the API runs as. Export them before `docker compose up`:
      #   export ZLABEL_UID=$(id -u) ZLABEL_GID=$(id -g)
      - ZLABEL_UID=${ZLABEL_UID:-0}
      - ZLABEL_GID=${ZLABEL_GID:-0}
      # auto = repair ./data when its storage root belongs to another uid;
      # `always` after somebody used sudo on the mount, `never` on NFS
      - ZLABEL_CHOWN=${ZLABEL_CHOWN:-auto}
      # the API owns the schema; the worker service must keep this at 0
      - ZLABEL_MIGRATE=1
      # ZLabel server
      - ZLSERVER_DATABASE_URL=sqlite+pysqlite:///./data/zlabel_server_v2.db
      - ZLSERVER_UPLOAD_DIR=/app/data/uploads
      # the server owns the datasets: mount the host directory at ./data/storage
      - ZLSERVER_STORAGE_ROOT=/app/data/storage
      # first-run admin (only created when the account does not exist yet)
      - ZLSERVER_PROJECT_ACCESS_MODE=open
      # - ZLSERVER_BOOTSTRAP_ADMIN=admin
      # the inference worker (separate service; see below / M3)
      - ZLSERVER_INFERENCE_URL=http://zlabel_inference:8001
      - ZLSERVER_INFERENCE_TIMEOUT=180
      # true: send the frame with every job; false: the worker pulls it on a cache miss
      - ZLSERVER_INFERENCE_INLINE_IMAGES=true
      # web administration UI
      - ZLSERVER_ADMIN_ENABLED=true
      - ZLSERVER_ADMIN_PATH=/admin
    networks:
      zlabel_server_network:
        ipv4_address: 172.20.0.2
    restart: unless-stopped

  # Inference worker: same image, worker entrypoint, owns the GPU. Because the
  # model lives here, restarting the API never reloads it.
  zlabel_inference:
    # same entrypoint and privilege drop as the API (see the note above)
    build:
      context: .
    command: ["/app/.venv/bin/fastapi", "run", "app/inference_worker/main.py", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - ZLABEL_UID=${ZLABEL_UID:-0}
      - ZLABEL_GID=${ZLABEL_GID:-0}
      # no ./data mount here: nothing to repair, nothing to migrate
      - ZLABEL_CHOWN=never
      - ZLABEL_MIGRATE=0
      - ZLSERVER_MODEL_NAME=SlimSAM   # EdgeSAM SAM SlimSAM SAM2 SAM3
      - ZLSERVER_MODEL_DIR=/app/assets/onnx
      - ZLSERVER_ORT_BACKEND=CUDA     # CPU CUDA (falls back to CPU if unavailable)
      - ZLSERVER_ORT_THREADS=8
      - ZLSERVER_API_BASE_URL=http://zlabel_server:8000
      - ZLSERVER_EMBEDDING_CACHE_SIZE=8
      - ZLSERVER_MAX_CONCURRENCY=1
      - ZLSERVER_SAM3_CONF=0.25
      - ZLSERVER_SAM3_IOU=0.7
      - ZLSERVER_CONTOUR_MIN_POINTS=10
      - ZLSERVER_CONTOUR_MAX_POINTS=100
      - ZLSERVER_CONTOUR_MAX_ITERATIONS=10
      - ZLSERVER_MIN_CONTOUR_AREA_RATIO=3.0e-5
      - ZLSERVER_EMBEDDING_CACHE_SIZE=32
    volumes:
      - ./assets:/app/assets
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks:
      zlabel_server_network:
        ipv4_address: 172.20.0.4
    restart: unless-stopped

networks:
  zlabel_server_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24