services:
  zlabel_server:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    environment:
      - ZLV2_DATABASE_URL=sqlite+pysqlite:///./data/zlabel_server_v2.db
      - ZLV2_UPLOAD_DIR=/app/data/uploads
      - ZLV2_OPLIST_HOST=http://172.20.0.3:5244
      - ZLV2_OPLIST_PROJ_DIR=/zlabel_server/projects
      - ZLV2_OPLIST_PROJ_NAME=seed_germ_1280
      - ZLV2_PROJECT_SCAN_INTERVAL=300
      # the inference worker (separate service; see below / M3)
      - ZLV2_INFERENCE_URL=http://zlabel_inference:8001
      - ZLV2_INFERENCE_TOKEN=${ZLV2_INFERENCE_TOKEN:-change-me}
    networks:
      zlabel_server_network:
        ipv4_address: 172.20.0.2
    depends_on:
      - openlist
    restart: unless-stopped

  # Inference worker: same image, worker entrypoint, owns the GPU. Because the
  # model lives here, restarting the API never reloads it.
  zlabel_inference:
    build:
      context: .
    command: ["sh", "-c", "uv run fastapi run v2/inference_worker/main.py --host 0.0.0.0 --port 8001"]
    environment:
      - ZLV2_MODEL_NAME=SlimSAM   # EdgeSAM SAM SlimSAM SAM2 SAM3
      - ZLV2_MODEL_DIR=/app/assets/onnx
      - ZLV2_ORT_BACKEND=CUDA     # CPU CUDA (falls back to CPU if unavailable)
      - ZLV2_INFERENCE_TOKEN=${ZLV2_INFERENCE_TOKEN:-change-me}
      - ZLV2_API_BASE_URL=http://zlabel_server:8000
      - ZLV2_EMBEDDING_CACHE_SIZE=8
      - ZLV2_MAX_CONCURRENCY=1
    volumes:
      - ./assets:/app/assets
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks:
      zlabel_server_network:
        ipv4_address: 172.20.0.4
    restart: unless-stopped

  openlist:
    image: 'openlistteam/openlist:latest'
    container_name: openlist
    user: '0:0' # Please replace `0:0` with the actual user ID and group ID you want to use to run OpenList.
    volumes:
      - './data/openlist:/opt/openlist/data'
      - '/mnt/datasets:/mnt/datasets'
    ports:
      - '5244:5244'
    environment:
      - UMASK=022
    networks:
      zlabel_server_network:
        ipv4_address: 172.20.0.3
    restart: unless-stopped

networks:
  zlabel_server_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
