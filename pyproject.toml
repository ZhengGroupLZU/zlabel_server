[project]
name = "zlabel-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi-users>=15.0.1",
    "fastapi[standard]>=0.115.12",
    "numpy>=2.2.5",
    "onnxruntime-gpu==1.26.0",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=11.2.1",
    "pydantic-settings>=2.11.0",
    "regex>=2024.11.6",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "sqlalchemy>=2.0.43",
    "typer>=0.15.0",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.uv]
python-install-mirror = "https://gh-proxy.com/https://github.com/astral-sh/python-build-standalone/releases/download"

[tool.ruff]
line-length = 110
# alembic autogenerates files with its own (dated) template style
extend-exclude = ["v2/db/migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "B905",
    "E712",
    "UP006",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=7.1.0",
    "joblib>=1.5.2",
    "pycocotools>=2.0.10",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
pythonpath = ["."]
markers = [
    "slow: 重型模型推理（真实大模型，需数十秒）",
    "gpu: 需要 CUDAExecutionProvider",
]
