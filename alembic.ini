# Alembic config for the app schema (fresh database; v1 data is not migrated).
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "message"
#
# The URL is resolved in app/db/migrations/env.py from ZLSERVER_DATABASE_URL (or -x
# db_url=...), so this file never holds credentials. Keep it ASCII-only: the
# config parser reads it with the console locale encoding (GBK on Windows).
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
